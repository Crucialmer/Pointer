; ==========================================================================
; Pointer: Windows 输入法中英状态指示器 (macOS 26 纯绿色重构版)
; 零安装 · 零依赖 · 配置文件严格仅保存在本程序同级目录
; ==========================================================================

[General]
; 指示器形态: badge (macOS 晶透微标「中/A」) 或 dot (极光呼吸微点)
IndicatorStyle = badge
; 色彩主题: auto (跟随系统深浅色自适应), light (浅色模式), dark (深色模式)
ThemeMode = auto
; 追踪模式: both (光标+鼠标), caret (仅文本光标), mouse (仅鼠标指针)
TrackMode = both
; 英文输入状态下是否显示指示器 (true / false)
ShowEnglish = true
; 是否启用平滑呼吸淡入淡出过渡动画
SmoothAnimation = true

[Badge]
BadgeWidth = 26
BadgeHeight = 20
BadgeCornerRadius = 6
BadgeFontSize = 10

[Dot]
DotSize = 10

[Colors]
LightCnColor = #FF5A00
LightEnColor = #007AFF
DarkCnColor = #FF9F0A
DarkEnColor = #0A84FF

[Offsets]
CaretOffsetX = 2
CaretOffsetY = 2
MouseOffsetX = 16
MouseOffsetY = 16

[System]
; 纯绿色开机启动 (true 写入当前用户的 HKCU Run，false 彻底清理)
AutoStart = false
PollIntervalMs = 16
